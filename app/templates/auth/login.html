<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PriceHawk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0f0f1a', card: '#1a1a2e', border: '#2a2a4a' },
                        accent: '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-dark-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-dark-card rounded-xl border border-gray-200 dark:border-dark-border shadow-xl p-8">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <a href="/" class="flex items-center gap-2 text-2xl font-bold text-gray-900 dark:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                PriceHawk
            </a>
        </div>

        <h2 class="text-xl font-semibold text-center text-gray-900 dark:text-white mb-6">Welcome Back</h2>

        <!-- Flash Notice Container (Server-rendered) -->
        {% if flash_messages %}
            <div id="flash-notices" class="mb-4 space-y-2">
                {% for message in flash_messages %}
                    <div class="p-3.5 rounded-lg text-sm flex items-center gap-2.5 border
                        {% if message.type == 'warning' %}bg-amber-500/10 border-amber-500/20 text-amber-500
                        {% elif message.type == 'error' %}bg-red-500/10 border-red-500/20 text-red-500
                        {% elif message.type == 'success' %}bg-green-500/10 border-green-500/20 text-green-500
                        {% else %}bg-blue-500/10 border-blue-500/20 text-blue-400{% endif %}">
                        {% if message.type == 'warning' %}
                            <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        {% elif message.type == 'error' %}
                            <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        {% else %}
                            <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        {% endif %}
                        <span class="flex-1 font-medium">{{ message.text }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Client-side Flash Notice Placeholder -->
        <div id="client-flash-notice" class="hidden mb-4 p-3.5 rounded-lg text-sm flex items-center gap-2.5 border"></div>

        <!-- Error message -->
        <div id="error-message" class="hidden mb-4 p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-500 text-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="error-text"></span>
        </div>

        <form id="login-form" class="space-y-4" data-next="{{ next or '' }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    class="w-full px-4 py-2.5 bg-gray-50 dark:bg-white/5 border border-gray-300 dark:border-dark-border rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-colors"
                    required
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-2.5 bg-gray-50 dark:bg-white/5 border border-gray-300 dark:border-dark-border rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-colors"
                    required
                />
            </div>

            <button type="submit" class="w-full py-2.5 bg-accent hover:bg-amber-600 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2" id="submit-btn">
                <span id="btn-text">Sign In</span>
                <svg id="btn-loading" class="hidden h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>
        </form>

        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-gray-200 dark:bg-dark-border"></div>
            <span class="text-sm text-gray-400">OR</span>
            <div class="flex-1 h-px bg-gray-200 dark:bg-dark-border"></div>
        </div>

        <div class="text-center text-sm text-gray-600 dark:text-gray-400 space-y-2">
            <p>
                <a href="/forgot-password" class="text-accent hover:underline">Forgot your password?</a>
            </p>
            <p>
                Don't have an account?
                <a href="/signup" class="text-accent hover:underline">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');

        const urlParams = new URLSearchParams(window.location.search);
        const notice = urlParams.get('notice');
        const message = urlParams.get('message');
        const nextParam = urlParams.get('next');
        const clientNotice = document.getElementById('client-flash-notice');
        const serverNotices = document.getElementById('flash-notices');

        // Client-side fallback if server-rendered notices were not present
        if (!serverNotices && clientNotice) {
            if (notice === 'session_expired' || urlParams.get('expired') !== null) {
                clientNotice.className = 'mb-4 p-3.5 rounded-lg text-sm flex items-center gap-2.5 border bg-amber-500/10 border-amber-500/20 text-amber-500';
                clientNotice.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="flex-1 font-medium">Your session has expired. Please log in again.</span>
                `;
                clientNotice.classList.remove('hidden');
            } else if (notice === 'login_required' || nextParam) {
                clientNotice.className = 'mb-4 p-3.5 rounded-lg text-sm flex items-center gap-2.5 border bg-blue-500/10 border-blue-500/20 text-blue-400';
                clientNotice.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="flex-1 font-medium">Please log in to access this page.</span>
                `;
                clientNotice.classList.remove('hidden');
            } else if (message) {
                clientNotice.className = 'mb-4 p-3.5 rounded-lg text-sm flex items-center gap-2.5 border bg-blue-500/10 border-blue-500/20 text-blue-400';
                const textSpan = document.createElement('span');
                textSpan.className = 'flex-1 font-medium';
                textSpan.textContent = message;
                clientNotice.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                `;
                clientNotice.appendChild(textSpan);
                clientNotice.classList.remove('hidden');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            errorDiv.classList.add('hidden');

            const email = form.email.value;
            const password = form.password.value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    document.cookie = `access_token=${data.access_token}; path=/; SameSite=Strict`;
                    const safeNextUrl = form.dataset.next;
                    if (safeNextUrl) {
                        window.location.href = safeNextUrl;
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    throw new Error(data.detail || 'Login failed');
                }
            } catch (err) {
                errorText.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
