[project]
name = "pricehawk"
version = "0.1.0"
description = "Monitor competitor prices, detect changes, and get AI-powered insights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "supabase>=2.27.0",
    "uvicorn[standard]>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "groq>=0.11.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.0.0",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Security",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.13"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_configs = true
files = [
    "app/api/routes/alert_http.py",
    "app/api/routes/alert_webhooks.py",
    "app/api/routes/alerts.py",
    "app/services/alert_delivery_service.py",
    "app/services/alert_detection.py",
    "app/services/alert_detection_policy.py",
    "app/services/alert_errors.py",
    "app/services/alert_maintenance.py",
    "app/services/alert_management_service.py",
    "app/services/alert_query_service.py",
    "app/services/alert_service.py",
    "app/services/alert_settings_service.py",
    "app/services/alert_webhook_dispatch.py",
    "app/services/email_service.py",
    "app/services/templates",
    "tests/test_alert_management.py",
    "tests/test_alert_service_collaborators.py",
    "tests/test_email_delivery.py",
    "tests/test_email_templates.py",
    "tests/test_development_verification.py",
]
